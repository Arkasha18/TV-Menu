version: 2

updates:
  - package-ecosystem: gradle
    directory: /TvQuickMenu
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    reviewers:
      - Arkasha18
    labels:
      - dependencies
    ignore:
      # AGP and Gradle wrapper must be upgraded together after compatibility checks.
      - dependency-name: com.android.application
      - dependency-name: gradle-wrapper
      # Kotlin 2.4+ needs compilerOptions DSL migration and should ride with AGP upgrades.
      - dependency-name: org.jetbrains.kotlin.android
        update-types:
          - version-update:semver-major
      # core-ktx 1.19+ requires AGP 9.1+.
      - dependency-name: "androidx.core:core-ktx"
        versions:
          - ">=1.19.0"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Europe/Moscow
    open-pull-requests-limit: 3
    reviewers:
      - Arkasha18
    labels:
      - dependencies
    ignore:
      - dependency-name: eclipse-temurin
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Europe/Moscow
    open-pull-requests-limit: 3
    reviewers:
      - Arkasha18
    labels:
      - dependencies
