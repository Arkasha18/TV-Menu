name: Сообщение об ошибке
description: Некорректное поведение TV Меню на телевизоре или при сборке
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Опишите проблему максимально конкретно. Не прикладывайте пароли, ключи ADB и персональные данные.
  - type: input
    id: version
    attributes:
      label: Версия
      description: Номер версии из приложения или релиза GitHub
      placeholder: "1.1.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Устройство
      description: Модель ТВ / приставки и версия Android / Google TV
      placeholder: "Haier Android TV, Android 14"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
    validations:
      required: true
  - type: dropdown
    id: accessibility
    attributes:
      label: Служба специальных возможностей
      options:
        - Включена и держится
        - Отскакивает
        - Не включал
        - Включил через локальный ADB в приложении
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Логи / дополнительная информация
      description: По желанию. Без секретов.
