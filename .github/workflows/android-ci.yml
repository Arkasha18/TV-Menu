name: Android CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build pinned toolchain image
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg "OCI_REVISION=${GITHUB_SHA}" \
            --tag tv-menu-build:ci \
            .

      - name: Lint and build debug APK
        run: |
          docker run --rm \
            --platform linux/amd64 \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            --env GRADLE_USER_HOME=/workspace/.gradle-ci \
            tv-menu-build:ci \
            bash -euo pipefail -c '
              chmod +x ./TvQuickMenu/gradlew
              ./TvQuickMenu/gradlew -p TvQuickMenu --no-daemon --stacktrace \
                lintDebug \
                assembleDebug
            '

      - name: Upload debug APK and lint reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tv-menu-debug-${{ github.sha }}
          path: |
            TvQuickMenu/app/build/outputs/apk/debug/*.apk
            TvQuickMenu/app/build/reports/lint-results-*.html
            TvQuickMenu/app/build/reports/lint-results-*.xml
          if-no-files-found: error
          retention-days: 14

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "${GHCR_TOKEN}" \
            | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Publish build environment to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          image_repo="ghcr.io/$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/tv-menu-build"
          short_sha="${GITHUB_SHA:0:12}"
          docker tag tv-menu-build:ci "${image_repo}:android35-jdk17"
          docker tag tv-menu-build:ci "${image_repo}:sha-${short_sha}"
          docker push "${image_repo}:android35-jdk17"
          docker push "${image_repo}:sha-${short_sha}"

      - name: Log out from GitHub Container Registry
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker logout ghcr.io
